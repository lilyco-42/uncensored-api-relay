name: ci

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: fmt + clippy + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --all-targets

  build:
    name: build (${{ matrix.target }})
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, target: x86_64-pc-windows-msvc, artifact: uncensored-proxy.exe }
          - { os: ubuntu-latest,  target: x86_64-unknown-linux-gnu,  artifact: uncensored-proxy }
          - { os: ubuntu-latest,  target: aarch64-unknown-linux-gnu, artifact: uncensored-proxy }
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install cross toolchain (GNU linux only)
        if: "!contains(matrix.target, 'windows')"
        run: |
          sudo apt-get update -qq
          case "${{ matrix.target }}" in
            aarch64-unknown-linux-gnu) sudo apt-get install -y -qq gcc-aarch64-linux-gnu ;;
            x86_64-unknown-linux-gnu)  sudo apt-get install -y -qq gcc-x86-64-linux-gnu ;;
          esac
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV
          echo "CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER=x86_64-linux-gnu-gcc" >> $GITHUB_ENV
          echo "CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc" >> $GITHUB_ENV
          echo "CC_x86_64_unknown_linux_gnu=x86_64-linux-gnu-gcc" >> $GITHUB_ENV

      - name: Build release
        run: cargo build --release --target ${{ matrix.target }} --locked

      - name: Smoke test (binary exists and is executable)
        shell: bash
        run: |
          BIN="target/${{ matrix.target }}/release/${{ matrix.artifact }}"
          ls -la "$BIN"
          file "$BIN"

      - name: Install zip
        shell: bash
        run: |
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            choco install -y 7zip --no-progress
            echo "C:\Program Files\7-Zip" >> $GITHUB_PATH
          else
            sudo apt-get update -qq && sudo apt-get install -y -qq zip
          fi

      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/${{ matrix.artifact }}" dist/
          cp README.md deploy/uncensored-proxy.service deploy/Caddyfile deploy/nginx-lain42.conf dist/
          cd dist
          if command -v zip >/dev/null 2>&1; then
            zip -r ../uncensored-relay-${{ matrix.target }}.zip .
          else
            7z a -tzip ../uncensored-relay-${{ matrix.target }}.zip .
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: uncensored-relay-${{ matrix.target }}
          path: uncensored-relay-${{ matrix.target }}.zip
          if-no-files-found: error

  release:
    name: release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.zip
          generate_release_notes: true
